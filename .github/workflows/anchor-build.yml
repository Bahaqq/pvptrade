name: Anchor cloud build

on:
  push:
    branches: [main]
    paths:
      - "programs/**"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/anchor-build.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "programs/**"
      - "Anchor.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/anchor-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: solanafoundation/anchor:v1.0.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show pinned toolchain
        run: anchor --version

      - name: Configure Rust toolchain
        run: rustup default stable

      - name: Build program
        shell: bash
        run: |
          set +e
          anchor build --ignore-keys 2>&1 | tee anchor-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            {
              echo "### Anchor build failure"
              echo '```text'
              tail -n 160 anchor-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            error_context=$(grep -n -B 3 -A 14 -E '^error(\[[A-Z0-9]+\])?:' anchor-build.log | head -n 120 || true)
            annotation=$(printf '%s\n' "$error_context" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Anchor build failure::$annotation"
          fi
          exit "$build_status"

      - name: Reclaim build space for LiteSVM
        run: |
          cp target/deploy/pvp_trade.so /tmp/pvp_trade.so
          cp target/deploy/mock_swap.so /tmp/mock_swap.so
          cargo clean
          mkdir -p target/deploy
          cp /tmp/pvp_trade.so target/deploy/pvp_trade.so
          cp /tmp/mock_swap.so target/deploy/mock_swap.so

      - name: Run custody integration tests
        shell: bash
        run: |
          set +e
          cargo test -p pvp_trade --test custody -- --nocapture 2>&1 | tee custody-test.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            failure_context=$(tail -n 180 custody-test.log)
            annotation=$(printf '%s\n' "$failure_context" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Custody test failure::$annotation"
          fi
          exit "$test_status"
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
