[package]
name = "mock_swap"
version = "0.1.0"
description = "Test-only exact-input swap router for PVP Trade LiteSVM tests"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_swap"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.0.2"
anchor-spl = "=1.0.2"
