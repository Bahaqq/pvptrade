[package]
name = "pvp_trade"
version = "0.1.0"
description = "PVP Trade battle lifecycle program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pvp_trade"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.0.2"
anchor-spl = "=1.0.2"

[dev-dependencies]
litesvm = "=0.13.1"
solana-account = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-program-option = "3"
solana-program-pack = "3.1"
solana-pubkey = "3"
solana-signer = "3"
solana-transaction = "3"
spl-token-interface = "=2.0.0"
