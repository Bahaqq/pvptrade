[package]
name = "pvp_trade"
version = "0.1.0"
description = "PVP Trade battle lifecycle program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pvp_trade"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.0.2"
anchor-spl = "=1.0.2"

[dev-dependencies]
litesvm = "=0.8.2"
solana-account = "~3.0"
solana-instruction = "~3.0"
solana-keypair = "~3.0"
solana-program-option = "~3.0"
solana-program-pack = "~3.0"
solana-pubkey = "~3.0"
solana-signer = "~3.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
solana-transaction = "=3.0.1"
spl-token-interface = "=2.0.0"
